services:
  backend:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/security_scanner}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/app/artifacts}
      SCANNER_BASE_URL: ${SCANNER_BASE_URL:-http://scanner:8001}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8002}
      INTEGRATION_TIMEOUT_SECONDS: ${INTEGRATION_TIMEOUT_SECONDS:-10}
      USE_MOCK_INTEGRATIONS: ${USE_MOCK_INTEGRATIONS:-false}
      TASK_MODE: ${TASK_MODE:-background}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-true}
      TARGET_LOGIN_PATH: ${TARGET_LOGIN_PATH:-/api/login}
      INTERNAL_AUTH_ENABLED: ${INTERNAL_AUTH_ENABLED:-true}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:4173","http://localhost:4173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  scanner:
    build:
      context: ..
      dockerfile: scanner/Dockerfile
    environment:
      BACKEND_BASE_URL: http://backend:8000
      SCANNER_EXTRA_OPENAPI_PATHS: ${SCANNER_EXTRA_OPENAPI_PATHS:-}
      INTERNAL_AUTH_ENABLED: ${INTERNAL_AUTH_ENABLED:-true}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}
      USER_A_USERNAME: ${USER_A_USERNAME:-}
      USER_A_PASSWORD: ${USER_A_PASSWORD:-}
      USER_B_USERNAME: ${USER_B_USERNAME:-}
      USER_B_PASSWORD: ${USER_B_PASSWORD:-}
    ports:
      - "8001:8001"
    depends_on:
      - backend

  llm:
    build:
      context: ..
      dockerfile: llm/Dockerfile
    environment:
      BACKEND_BASE_URL: http://backend:8000
      INTERNAL_AUTH_ENABLED: ${INTERNAL_AUTH_ENABLED:-true}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8002:8002"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_scanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
