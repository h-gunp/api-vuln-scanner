services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_scanner_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_scanner_test"]
      interval: 2s
      timeout: 3s
      retries: 15

