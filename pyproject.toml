[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-vuln-scanner"
version = "0.1.0"
description = "Scanner and schema-first LLM workers for API vulnerability analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "openai>=1.42.0,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["scanner*", "llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
